<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comics - Lich and Lily Comics</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="assets/logo.png" alt="Lich and Lily Comics Logo" id="logo">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="characters.html">Characters</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="comics.html">Comics</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="comic-list">
            <div class="comic">
                <h2>Comic 1</h2>
                <div class="image-gallery">
                    <button class="scroll-left" onclick="scrollLeft('gallery1')">&#8592;</button>
                    <div class="gallery" id="gallery1">
                        <img class="comic-image" src="assets/Comic 1 Panel 1.jpg" alt="Comic 1 Panel 1">
                        <img class="comic-image" src="assets/Comic 1 Panel 2.jpg" alt="Comic 1 Panel 2">
                        <img class="comic-image" src="assets/Comic 1 Panel 3.jpg" alt="Comic 1 Panel 3">
                        <img class="comic-image" src="assets/Comic 1 Panel 4.jpg" alt="Comic 1 Panel 4">
                        <img class="comic-image" src="assets/Comic 1 Panel 5.jpg" alt="Comic 1 Panel 5">
                    </div>
                    <button class="scroll-right" onclick="scrollRight('gallery1')">&#8594;</button>
                </div>
            </div>
            <div class="comic">
                <h2>Comic 2</h2>
                <div class="image-gallery">
                    <button class="scroll-left" onclick="scrollLeft('gallery2')">&#8592;</button>
                    <div class="gallery" id="gallery2">
                        <img class="comic-image" src="assets/comic2_image1.jpg" alt="Comic 2 Image 1">
                        <img class="comic-image" src="assets/comic2_image2.jpg" alt="Comic 2 Image 2">
                        <img class="comic-image" src="assets/comic2_image3.jpg" alt="Comic 2 Image 3">
                    </div>
                    <button class="scroll-right" onclick="scrollRight('gallery2')">&#8594;</button>
                </div>
            </div>
            <div class="comic">
                <h2>Comic 3</h2>
                <div class="image-gallery">
                    <button class="scroll-left" onclick="scrollLeft('gallery3')">&#8592;</button>
                    <div class="gallery" id="gallery3">
                        <img class="comic-image" src="assets/comic3_image1.jpg" alt="Comic 3 Image 1">
                        <img class="comic-image" src="assets/comic3_image2.jpg" alt="Comic 3 Image 2">
                        <img class="comic-image" src="assets/comic3_image3.jpg" alt="Comic 3 Image 3">
                    </div>
                    <button class="scroll-right" onclick="scrollRight('gallery3')">&#8594;</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
